<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="template:media-width" content="1024">
    <meta name="template:media-height" content="1024">
    <meta name="viewport" content="width=1080, height=1920">
    <title>I2V Clean Overlay - 1080x1920</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 1080px;
            height: 1920px;
            margin: 0;
            overflow: hidden;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        }

        body {
            position: relative;
            color: #ffffff;
        }

        .edge-vignette {
            position: absolute;
            inset: 0;
            background:
                linear-gradient(180deg, rgba(0, 0, 0, 0.52) 0%, rgba(0, 0, 0, 0.08) 22%, rgba(0, 0, 0, 0.0) 46%),
                linear-gradient(0deg, rgba(0, 0, 0, 0.62) 0%, rgba(0, 0, 0, 0.24) 22%, rgba(0, 0, 0, 0.0) 48%);
            pointer-events: none;
        }

        .title {
            position: absolute;
            top: 92px;
            left: 64px;
            right: 64px;
            min-height: 104px;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
        }

        .title-text {
            max-width: 820px;
            font-size: 68px;
            line-height: 1.15;
            font-weight: 800;
            letter-spacing: 0;
            text-shadow: 0 4px 22px rgba(0, 0, 0, 0.58);
            overflow-wrap: anywhere;
        }

        .caption {
            position: absolute;
            left: 72px;
            right: 72px;
            bottom: 132px;
            min-height: 198px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 34px 44px;
            border-radius: 8px;
            background: rgba(8, 12, 18, 0.48);
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .caption-text {
            width: 100%;
            max-height: 150px;
            font-size: 48px;
            line-height: 1.36;
            font-weight: 700;
            letter-spacing: 0;
            text-align: center;
            text-shadow: 0 3px 16px rgba(0, 0, 0, 0.72);
            overflow: hidden;
            overflow-wrap: anywhere;
        }

        .scene-index {
            position: absolute;
            right: 72px;
            top: 108px;
            width: 84px;
            height: 84px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.72);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            line-height: 1;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.92);
            text-shadow: 0 3px 14px rgba(0, 0, 0, 0.58);
        }
    </style>
</head>
<body>
    <div class="edge-vignette"></div>

    <header class="title">
        <div class="title-text">{{title}}</div>
    </header>

    <div class="scene-index">{{index}}</div>

    <main class="caption">
        <div class="caption-text">{{text}}</div>
    </main>

    <script>
        const index = Number("{{index}}");
        const title = document.querySelector(".title");
        const caption = document.querySelector(".caption-text");

        if (title && index > 1) {
            title.style.display = "none";
        }

        if (caption) {
            while (caption.scrollHeight > caption.clientHeight && parseFloat(getComputedStyle(caption).fontSize) > 36) {
                const size = parseFloat(getComputedStyle(caption).fontSize);
                caption.style.fontSize = `${size - 2}px`;
            }
        }
    </script>
</body>
</html>
